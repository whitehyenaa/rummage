name: Publish to Modrinth

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from release tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew build -Pmod_version="${VERSION%%+*}"

      - name: Attach jar to release
        run: gh release upload "$GITHUB_REF_NAME" build/libs/rummage-*.jar --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/rummage-*.jar
          name: Rummage ${{ env.VERSION }}
          version: ${{ env.VERSION }}
          version-type: release
          changelog: ${{ github.event.release.body }}
          loaders: fabric
          game-versions: 26.1.2
          dependencies: |
            fabric-api(required)
            modmenu(optional)
